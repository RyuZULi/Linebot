      <text x="16" y="324" fill="#52514e">下次辨識到炒麵就查得到</text>
      <text x="16" y="352" fill="#8a8984">nutrition_lookup.add_user_food</text>

      <line x1="300" y1="295" x2="274" y2="295" stroke="#8a8984" stroke-width="2" marker-end="url(#a1)"/>
    </g>
    <!-- 底部原則 -->
    <rect x="0" y="410" width="1168" height="170" rx="10" fill="#fff" stroke="#d9d8d3"/>
    <g font-size="16">
      <text x="24" y="444" font-weight="700" font-size="18">貫穿全程的三個原則</text>
      <text x="24" y="478">1. 熱量數字只能來自資料庫或有出處的份量，<tspan font-weight="700">LLM 不寫數字</tspan>（這個 bot 的 LLM 只負責看圖和聊天）</text>
      <text x="24" y="510">2. 查不到就標「查無資料」不計入，<tspan font-weight="700">不硬湊一個最接近的答案</tspan></text>
      <text x="24" y="542">3. 每個門檻和規則都用測試資料校準（0.4、0.70、典型份量），<tspan font-weight="700">不憑感覺</tspan></text>
    </g>
  </svg>
</section></div>

<div class="scroll"><section class="fig" id="d2">
  <span class="fig-id">圖D2</span>
  <h2>查熱量：依序查 7 層，查到就停</h2>
  <p class="sub">「完全相同」一律優先於「相近」；官方資料優先於非官方資料</p>
  <svg width="1168" height="600" viewBox="0 0 1168 600">
    <g font-size="16">
      <!-- ladder rows: y step 64 -->
      <g>
        <rect x="0" y="0" width="760" height="52" rx="8" fill="#def4ea" stroke="#1baf7a"/>
        <text x="20" y="33" font-weight="700">1</text><text x="56" y="33">衛福部食品營養資料庫（2,180 筆）：品名或俗名完全相同</text>
        <text x="740" y="33" text-anchor="end" fill="#52514e">官方送檢數據</text>
      </g>
      <g>
        <rect x="0" y="64" width="760" height="52" rx="8" fill="#def4ea" stroke="#1baf7a"/>
        <text x="20" y="97" font-weight="700">2</text><text x="56" y="97">衛福部資料庫：向量相似度 ≥ 0.70（LlamaIndex ＋ bge-m3）</text>
      </g>
      <g>
        <rect x="0" y="128" width="760" height="52" rx="8" fill="#fff" stroke="#d9d8d3"/>
        <text x="20" y="161" font-weight="700">3</text><text x="56" y="161">使用者自己回報過的菜：完全相同</text>
        <text x="740" y="161" text-anchor="end" fill="#52514e">本人講的</text>
      </g>
      <g>
        <rect x="0" y="192" width="760" height="52" rx="8" fill="#fff" stroke="#d9d8d3"/>
        <text x="20" y="225" font-weight="700">4</text><text x="56" y="225">台大自助餐熱量表（83 道）：完全相同</text>
        <text x="740" y="225" text-anchor="end" fill="#52514e">僅供參考的公開表</text>
      </g>
      <g>
        <rect x="0" y="256" width="760" height="52" rx="8" fill="#fff" stroke="#d9d8d3"/>
        <text x="20" y="289" font-weight="700">5</text><text x="56" y="289">使用者回報：相近（≥ 0.70）</text>
      </g>
      <g>
        <rect x="0" y="320" width="760" height="52" rx="8" fill="#fff" stroke="#d9d8d3"/>
        <text x="20" y="353" font-weight="700">6</text><text x="56" y="353">台大自助餐熱量表：相近（≥ 0.65）</text>
      </g>
      <g>
        <rect x="0" y="384" width="760" height="52" rx="8" fill="#fde9e0" stroke="#eb6834"/>
        <text x="20" y="417" font-weight="700">7</text><text x="56" y="417">都沒有 → 「查無資料」，誠實回報，不計入總熱量</text>
      </g>
    </g>
    <g font-size="16">
      <rect x="800" y="0" width="368" height="436" rx="10" fill="#fff" stroke="#d9d8d3"/>
      <text x="822" y="36" font-size="18" font-weight="700">每一層都有的過濾</text>
      <text x="822" y="76" font-weight="700">模糊俗名黑名單</text>
      <text x="822" y="102" fill="#52514e">「土豆」在資料庫是花生的俗名</text>
      <text x="822" y="126" fill="#52514e">→ 不准當完全相同使用（差 7 倍）</text>
      <text x="822" y="176" font-weight="700">乾貨／粉類過濾</text>
      <text x="822" y="202" fill="#52514e">問的名稱沒有「乾」「粉」</text>
      <text x="822" y="226" fill="#52514e">→ 跳過「花椰菜乾」「麵粉」</text>
      <text x="822" y="276" font-weight="700">門檻 0.70 怎麼來的</text>
      <text x="822" y="302" fill="#52514e">測試詞的雜訊上限約 0.59</text>
      <text x="822" y="326" fill="#52514e">（腳踏車→豬蹄膀 0.59）</text>
      <text x="822" y="350" fill="#52514e">合理比對落在 0.68～0.75</text>
      <text x="822" y="374" fill="#52514e">→ 取 0.70，寧可查無資料</text>
      <text x="822" y="398" fill="#52514e">　也不要張冠李戴</text>
    </g>
    <text x="0" y="490" font-size="17" font-weight="700">為什麼「完全相同」要排在「相近」前面，即使來源比較不官方？</text>
    <text x="0" y="522" font-size="16" fill="#52514e">實測「炸豬排」被相近比對到使用者回報的「炸豬排便當」（整個便當的熱量），排在台大表完全相同的「炸豬排」前面，</text>
    <text x="0" y="548" font-size="16" fill="#52514e">等於把白飯和配菜又算一次。名稱完全相同的資料，就算不是官方的，也比「名稱很像」的官方資料可靠。</text>
  </svg>
</section></div>

<!-- ============ D3 CEC 細節 ============ -->
<div class="scroll"><section class="fig" id="d3">
  <span class="fig-id">圖D3</span>
  <h2>CEC_API助手：每個問題怎麼被處理</h2>
  <p class="sub">灰＝程式規則（依序檢查，符合就停）　綠＝LlamaIndex 檢索　藍＝LLM 生成　虛線＝不經 LLM</p>
  <svg width="1089" height="550" viewBox="0 0 1168 590">
    <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
    <g font-size="14">
      <rect x="0" y="0" width="560" height="590" rx="12" fill="#f4f4f2" stroke="#8a8984"/>
      <text x="20" y="30" font-size="17" font-weight="700">程式規則（不靠 AI）</text>

      <text x="20" y="62" font-weight="700">① 回答回問？</text>
      <text x="44" y="84" fill="#52514e">輸入編號或照打選項原文 → 當成點選</text>

      <text x="20" y="116" font-weight="700">② 貼上錯誤訊息？</text>
      <text x="44" y="138" fill="#52514e">332 條原文，去空白標點和 ID 數字後比對</text>
      <text x="44" y="160" fill="#52514e">命中 → 那一條照原文輸出（排在按鈕比對前面）</text>

      <text x="20" y="192" font-weight="700">③ 不屬於本外掛？</text>
      <text x="44" y="214" fill="#52514e">機電、土木、Autodesk… → 轉介負責人</text>
      <text x="44" y="236" fill="#52514e">例外：正在聊某按鈕、或就是本庫常見問題原文</text>

      <text x="20" y="268" font-weight="700">④ 提到按鈕名稱？</text>
      <text x="44" y="290" fill="#52514e">中英文名、別名、核心詞（去掉結尾的「檢查」…）</text>
      <text x="44" y="312" fill="#52514e">正規化＋同長度錯一個字；多個 → 回問選哪個</text>

      <text x="20" y="344" font-weight="700">⑤ 正在聊某個按鈕？</text>
      <text x="44" y="366" fill="#52514e">別的按鈕明顯更像（差距 ≥ 0.09）→ 回問是否換話題</text>
      <text x="44" y="388" fill="#52514e">否則當追問，附最近 2 輪問答</text>

      <text x="20" y="420" font-weight="700">⑥ 通用問題？</text>
      <text x="44" y="442" fill="#52514e">「灰色」「授權」→ 直接指定那一段</text>

      <text x="20" y="474" font-weight="700">⑦ 都不是 → 回問「是哪個功能」</text>

      <line x1="20" y1="496" x2="540" y2="496" stroke="#d9d8d3"/>
      <text x="20" y="522" fill="#52514e">對話狀態以聊天室為單位，1 天沒說話重設</text>
      <text x="20" y="546" fill="#52514e">分流回歸測試 57 題（不呼叫 LLM，約 20 秒）</text>
      <text x="20" y="570" fill="#52514e">每次問答記錄路線、用到的段落、👍／👎</text>
    </g>

    <line x1="560" y1="300" x2="616" y2="300" stroke="#8a8984" stroke-width="2" marker-end="url(#a3)"/>

    <g font-size="14">
      <rect x="620" y="0" width="548" height="120" rx="12" fill="#f4f4f2" stroke="#8a8984"/>
      <text x="640" y="28" font-size="16" font-weight="700">鎖定按鈕後：問得太籠統就先問清楚</text>
      <text x="640" y="54" fill="#52514e">含「壞掉、不能用…」且跟卡片每條常見問題相似度 &lt; 0.80</text>
      <text x="640" y="78" fill="#52514e">→ 回問「發生什麼狀況？」選項＝卡片自己的常見問題</text>
      <text x="640" y="102" fill="#8a8984">（具體描述 0.77～0.98、籠統說法 ≤ 0.62）</text>

      <line x1="894" y1="120" x2="894" y2="146" stroke="#8a8984" stroke-width="2" marker-end="url(#a3)"/>

      <rect x="620" y="150" width="548" height="130" rx="12" fill="#def4ea" stroke="#1baf7a"/>
      <text x="640" y="178" font-size="16" font-weight="700">LlamaIndex 檢索</text>
      <text x="640" y="204" fill="#52514e">62 份文件切成 689 段：一般段落依 ## 切，</text>
      <text x="640" y="226" fill="#52514e">常見問題、錯誤訊息一條一塊（同按鈕不同問題才分得開）</text>
      <text x="640" y="250" fill="#52514e">retriever 取前 4 段 ＋ MetadataFilters（只搜鎖定的按鈕）</text>
      <text x="640" y="272" fill="#8a8984">卡片更新：依 SHA1 判斷，delete(ref_doc_id) 後重建</text>

      <line x1="894" y1="280" x2="894" y2="306" stroke="#8a8984" stroke-width="2" marker-end="url(#a3)"/>

      <rect x="620" y="310" width="548" height="180" rx="12" fill="#e3eefb" stroke="#2a78d6"/>
      <text x="640" y="338" font-size="16" font-weight="700">qwen3:8b 生成（關閉思考模式、溫度 0.1）</text>
      <text x="640" y="364">參考資料 → 找誰問 → 先前對話 → 問題 → <tspan font-weight="700">規則</tspan> → 回答：</text>
      <text x="640" y="390" fill="#52514e">規則：只根據資料、不可拼湊、沒資料就說沒資料</text>
      <text x="640" y="414" fill="#52514e">找誰問：有鎖定按鈕時只給該按鈕類別的負責人</text>
      <text x="640" y="438" fill="#52514e">後處理：刪掉模型寫的網址 → 程式附上說明頁連結</text>
      <text x="640" y="462" fill="#52514e">　　　　簡體字只轉換知識庫沒用過的字</text>

      <rect x="620" y="510" width="548" height="80" rx="12" fill="#fcfcfb" stroke="#8a8984" stroke-dasharray="6 4"/>
      <text x="640" y="538" font-size="16" font-weight="700">只命中一條資料 → 照原文輸出，不經 LLM</text>
      <text x="640" y="564" fill="#52514e">錯誤訊息命中（②）、或點了「發生什麼狀況」的選項</text>
      <text x="640" y="584" fill="#8a8984">不會編造、不會多補延伸說明、也比較快</text>
    </g>
  </svg>
</section></div>
